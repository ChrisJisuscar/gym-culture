{% extends "backoffice/base.html" %}
{% block title %}Productos{% endblock %}
{% block view_name %}products{% endblock %}
{% block content %}
  <header class="bo-heading"><div><p class="eyebrow">CATÁLOGO</p><h1>Productos</h1></div><a class="bo-button" href="{% url 'backoffice-product-create-page' %}">NUEVO PRODUCTO</a></header>
  <form id="product-filters" class="bo-filters">
    <input name="search" placeholder="Buscar producto">
    <select id="product-category-filter" name="category"><option value="">Todas las categorías</option></select>
    <select name="active"><option value="">Todos los estados</option><option value="true">Activos</option><option value="false">Inactivos</option></select>
    <button class="bo-button" type="submit">FILTRAR</button>
  </form>
  <p id="bo-feedback" class="bo-feedback" role="status">Cargando productos…</p>
  <section class="bo-panel"><div id="bo-products"></div><nav id="bo-pagination" class="bo-pagination"></nav></section>
{% endblock %}
