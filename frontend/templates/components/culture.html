{% load static %}
<section id="culture" class="section culture-section">
  <div class="section-heading"><div><h2>ELEG&Iacute; TU<br><i>CULTURA.</i></h2></div></div>
  <div class="culture-carousel" role="region" aria-label="Culturas">
    <div class="culture-carousel__stage">
      <div class="culture-carousel__ring">
        <a
          href="{% url 'create-tshirt' %}?culture=gymrat"
          class="culture-card culture-gymrat"
          data-culture="gymrat"
        >
          <div class="culture-card__back" aria-hidden="true"></div>
          <div class="culture-card__face">
            <div
              class="culture-photo"
              aria-hidden="true"
              style="--culture-image: url('{% static 'images/culture/gymrat.jpg' %}')"
            ></div>
            <div class="card-copy">
              <h3>GYMRAT</h3>
              <p>
                Ser gymrat no es una moda,<br>
                es una obsesi&oacute;n.
              </p>
            </div>
          </div>
        </a>
        <a
          href="{% url 'create-tshirt' %}?culture=anime"
          class="culture-card culture-anime"
          data-culture="anime"
        >
          <div class="culture-card__back" aria-hidden="true"></div>
          <div class="culture-card__face">
            <div
              class="culture-photo"
              role="img"
              aria-label="Guerrero anime entrenando"
              style="--culture-image: url('{% static 'images/culture/toji-gym.jpg' %}')"
            ></div>
            <div class="card-copy">
              <h3>ANIME</h3>
              <p>
                Entren&aacute; como si tu historia<br>
                dependiera de ello.
              </p>
            </div>
          </div>
        </a>
        <a
          href="{% url 'create-tshirt' %}?culture=memes"
          class="culture-card culture-memes"
          data-culture="memes"
        >
          <div class="culture-card__back" aria-hidden="true"></div>
          <div class="culture-card__face">
            <div
              class="culture-photo"
              role="img"
              aria-label="Mona Lisa musculosa con batido"
              style="--culture-image: url('{% static 'images/culture/monalisa-musculosa.jpg' %}')"
            ></div>
            <div class="card-copy">
              <h3>MEMES</h3>
            </div>
          </div>
        </a>
        <a
          href="{% url 'create-tshirt' %}?culture=urban"
          class="culture-card culture-urban"
          data-culture="urban"
        >
          <div class="culture-card__back" aria-hidden="true"></div>
          <div class="culture-card__face">
            <div
              class="culture-photo"
              role="img"
              aria-label="Hoodie urbano con dise&ntilde;o gr&aacute;fico"
              style="--culture-image: url('{% static 'images/culture/hoodie-urbano.webp' %}')"
            ></div>
            <div class="card-copy">
              <h3>URBANO</h3>
              <p>La calle tambi&eacute;n ense&ntilde;a.</p>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
